<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HORUS</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%;
        background: radial-gradient(ellipse at center, #0a0a14 0%, #06060a 70%);
        color: #D4AF37; font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        display: flex; align-items: center; justify-content: center;
      }
      .wrap { text-align: center; }
      .ring {
        width: 72px; height: 72px; margin: 0 auto 24px;
        border: 1px solid rgba(212,175,55,0.25); border-top-color: #D4AF37;
        border-radius: 50%; animation: spin 1.4s linear infinite;
      }
      h1 { margin: 0; font-size: 22px; letter-spacing: 0.5em; font-weight: 700; }
      p { margin: 10px 0 0; font-size: 10px; letter-spacing: 0.35em; opacity: 0.6; color: #9aa0aa; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="ring"></div>
      <h1>HORUS</h1>
      <p id="status">INITIALIZING SHELL…</p>
    </div>
    <script>
      // Confirms the contextBridge surfaced correctly in the renderer.
      if (window.horus && window.horus.isDesktop) {
        document.getElementById('status').textContent = 'DESKTOP SHELL READY · ' + window.horus.platform.toUpperCase();
      }
    </script>
  </body>
</html>
