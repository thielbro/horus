appId: app.horus.desktop
productName: HORUS
copyright: HORUS

directories:
  output: desktop/release
  buildResources: desktop/build

# Ship only the Electron shell in the asar. The Next app is served by the embedded
# standalone server bundled via extraResources below (it carries its own node_modules),
# so we deliberately exclude the project's node_modules and source from the asar.
files:
  - desktop/**/*
  - "!desktop/release/**"
  - "!desktop/release-*/**"
  - "!desktop/.staging/**"
  - "!desktop/build/**"
  - package.json

# The standalone Next server (server.js + .next + public + its node_modules) is copied
# into resources/server by this hook. extraResources is deliberately NOT used because
# electron-builder strips node_modules out of extraResources directories.
afterPack: ./desktop/after-pack.js

# App + installer icon. Generated from the HORUS brand mark by scripts/make-icon.js;
# also auto-detected as buildResources/icon.ico, but set explicitly for clarity.
win:
  target: nsis
  icon: desktop/build/icon.ico

linux:
  target:
    - target: deb
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
  icon: desktop/build/icon.png
  category: Utility
  maintainer: HORUS
  syncDesktopName: true

nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: desktop/build/icon.ico
  uninstallerIcon: desktop/build/icon.ico
