worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Define a cache zone named 'tile_cache', with a 100MB RAM index, and 10GB max disk size.
    proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tile_cache:100m max_size=10g inactive=365d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/osint levels=1:2 keys_zone=osint_cache:50m max_size=2g inactive=30d use_temp_path=off;

    map $request_method $osint_cache_bypass {
        default 1;
        GET 0;
        HEAD 0;
    }

    # DNS resolver required to resolve upstream domain names
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    server {
        listen 8080;

        location = /health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }
        
        # Route 1: Proxy map tiles from CARTO
        # Allowlist host inside the regex itself
        location ~ ^/proxy/tiles/(?<target_domain>(?:[a-d]\.)?basemaps\.cartocdn\.com)/(?<target_path>.*)$ {
            
            # Reconstruct the upstream URL
            proxy_pass https://$target_domain/$target_path$is_args$args;
            
            # Essential Headers for upstream
            proxy_set_header Host $target_domain;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;
            
            # Strip cookies just in case
            proxy_hide_header Set-Cookie;
            proxy_ignore_headers Set-Cookie;
            
            # Caching Rules
            proxy_cache tile_cache;
            proxy_cache_valid 200 304 365d;   # Cache successful responses for 1 year
            proxy_cache_valid any 1m;         # Cache failures for 1 min
            proxy_cache_lock on;              # Prevent thundering herd
            
            # Force browser caching
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            
        }

        # Catch-all 403 — nginx checks regex locations in source order, so the
        # allowlist above still wins for cartocdn requests.
        location ~ ^/proxy/tiles/ {
            return 403;
        }

        # Route 2: Allowlisted OSINT cache endpoints for the intel service.
        location = /proxy/osint/wikidata/sparql {
            proxy_pass https://query.wikidata.org/sparql$is_args$args;
            proxy_set_header Host query.wikidata.org;
            proxy_set_header User-Agent $http_user_agent;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_cache osint_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_bypass $osint_cache_bypass;
            proxy_no_cache $osint_cache_bypass;
            proxy_cache_valid 200 304 24h;
            proxy_cache_valid 429 503 5m;
            proxy_cache_valid any 1m;
            proxy_cache_lock on;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_hide_header Set-Cookie;
            proxy_ignore_headers Set-Cookie;
            add_header X-Cache-Status $upstream_cache_status;
        }

        location = /proxy/osint/wikidata/api {
            proxy_pass https://www.wikidata.org/w/api.php$is_args$args;
            proxy_set_header Host www.wikidata.org;
            proxy_set_header User-Agent $http_user_agent;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_cache osint_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_bypass $osint_cache_bypass;
            proxy_no_cache $osint_cache_bypass;
            proxy_cache_valid 200 304 24h;
            proxy_cache_valid 429 503 5m;
            proxy_cache_valid any 1m;
            proxy_cache_lock on;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_hide_header Set-Cookie;
            proxy_ignore_headers Set-Cookie;
            add_header X-Cache-Status $upstream_cache_status;
        }

        location = /proxy/osint/opensanctions/datasets/latest/us_ofac_sdn/targets.simple.csv {
            proxy_pass https://data.opensanctions.org/datasets/latest/us_ofac_sdn/targets.simple.csv$is_args$args;
            proxy_set_header Host data.opensanctions.org;
            proxy_set_header User-Agent $http_user_agent;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.2 TLSv1.3;

            proxy_cache osint_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_bypass $osint_cache_bypass;
            proxy_no_cache $osint_cache_bypass;
            proxy_cache_valid 200 304 24h;
            proxy_cache_valid 429 503 5m;
            proxy_cache_valid any 1m;
            proxy_cache_lock on;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_hide_header Set-Cookie;
            proxy_ignore_headers Set-Cookie;
            add_header X-Cache-Status $upstream_cache_status;
        }

        location ^~ /proxy/osint/ {
            return 403;
        }

        # Route 3: Pass everything else to HORUS
        location / {
            # In docker-compose, 'horus' is the hostname of the Next.js container
            proxy_pass http://horus:3000;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (Required for Next.js hot reloading and potential live feeds)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
